  </g>

  <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width=".9" stroke-linejoin="round">
    <path d="M 155.699,137.972 H 60.941 v 237.175 h 94.758 z" transform="matrix(1.3333333,0,0,-1.3333333,0,684.16)"/>
    <path d="m 0,0 -118.588,-205.399 -82.062,47.378 118.587,205.4 z" transform="matrix(1.3333333,0,0,-1.3333333,475.13267,236.7332)"/>
    <path d="m 451.107,137.972 h -94.758 v 237.175 h 94.758 z" transform="matrix(1.3333333,0,0,-1.3333333,0,684.16)"/>
  </g>

