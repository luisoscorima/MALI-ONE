<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="54 54 576 576" overflow="hidden">
  <defs>
    <linearGradient id="glass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#35d8ff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#a9c8ff" stop-opacity=".30"/>
      <stop offset=".72" stop-color="#8879ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#cf5fff" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ce6ff"/>
      <stop offset=".38" stop-color="#d8f3ff"/>
      <stop offset=".7" stop-color="#aeb5ff"/>
      <stop offset="1" stop-color="#d663ff"/>
    </linearGradient>
    <linearGradient id="letterGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#dbe8ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#a996ff" stop-opacity=".70"/>
    </linearGradient>
    <filter id="panelFx" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#3a78ff" flood-opacity=".68" result="blue"/>
      <feComposite in="blue" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="letterFx" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.3" result="blur"/>
      <feFlood flood-color="#74a9ff" flood-opacity=".75"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feSpecularLighting in="SourceAlpha" surfaceScale="4" specularConstant=".75" specularExponent="18" lighting-color="#ffffff" result="spec">
        <fePointLight x="180" y="90" z="170"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="specClip"/></feMerge>
    </filter>
  </defs>

  <g fill="url(#glass)" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="round" filter="url(#panelFx)">
    <path d="M 155.699,137.972 H 60.941 v 237.175 h 94.758 z" transform="matrix(1.3333333,0,0,-1.3333333,0,684.16)"/>
