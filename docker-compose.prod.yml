# Producción en EC2: web accesible desde Nginx Proxy Manager por red Docker compartida.
# NPM Forward Hostname: mali-one-web | Forward Port: 80

services:
  api:
    environment:
      NODE_ENV: production
      TRUST_PROXY: 'true'
      PROCESS_ROLE: http

  api-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: 'true'
      PROCESS_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ${GOOGLE_SECRETS_DIR:-./secrets}:/run/secrets:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/ready']
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    container_name: mali-one-web
    ports: !override []
    networks:
      - internal
      - npm

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
