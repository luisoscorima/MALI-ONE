map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30M;

    location /api/bsale/ {
        proxy_pass http://api:3000/api/bsale/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Export / builds largas; la vista previa usa polling corto.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Kiosk media: the API streams it from S3, so nginx must stream it too.
    # Buffering a 20 MB clip to a temp file delays the first byte and hammers
    # the disk once per screen and per retry.
    location = /api/screen-cast/media {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        gzip off;
        # A TV on a slow link takes minutes to drain a clip.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ffprobe on a remote video can take well over the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO (polling + websocket upgrade) for screen-cast
    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Clock frames are tiny; Nagle would add latency to every play:go.
        tcp_nodelay on;
    }

    location /r/ {
        proxy_pass http://api:3000/r/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /n/ {
        proxy_pass http://api:3000/n/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mail/ {
        proxy_pass http://api:3000/mail/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Widgets estáticos: no caer en index.html del admin (evita HTML servido como .woff2/.js)
    location /widgets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA: no tratar /presentacion como directorio estático (evita 403)
    location = /presentacion {
        try_files /index.html =404;
    }
    location = /presentacion/ {
        try_files /index.html =404;
    }

    # Assets de la presentación (isométricos); no caer en index.html
    location /presentacion-assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        # Sin $uri/: un directorio vacío en public/ devolvería 403
        try_files $uri /index.html;
    }
}
